version: 2
updates:
  # pnpm projects use the "npm" ecosystem.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Minor and patch updates arrive as one PR; major updates get their own.
      dependencies:
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint and svelte-check don't support TypeScript 7 yet.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']
